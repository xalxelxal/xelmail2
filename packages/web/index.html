<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050816" />
        <title>mail2telegram</title>
    </head>
    <body>
        <canvas id="bg-net" aria-hidden="true"></canvas>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
        <script>
            // Jaring partikel (plexus) ala panel D33MzVPNs — latar #050816
            (function () {
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                var cv = document.getElementById('bg-net');
                var ctx = cv.getContext('2d');
                var W, H, pts = [];
                var LINK = 130, COUNT = 70;
                function resize() {
                    var dpr = Math.min(window.devicePixelRatio || 1, 2);
                    W = window.innerWidth; H = window.innerHeight;
                    cv.width = W * dpr; cv.height = H * dpr;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
                function init() {
                    pts = [];
                    for (var i = 0; i < COUNT; i++) {
                        pts.push({
                            x: Math.random() * W, y: Math.random() * H,
                            vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
                            r: 1 + Math.random() * 1.6
                        });
                    }
                }
                function step() {
                    ctx.clearRect(0, 0, W, H);
                    for (var i = 0; i < pts.length; i++) {
                        var p = pts[i];
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0 || p.x > W) p.vx *= -1;
                        if (p.y < 0 || p.y > H) p.vy *= -1;
                        for (var j = i + 1; j < pts.length; j++) {
                            var q = pts[j], dx = p.x - q.x, dy = p.y - q.y;
                            var d = Math.sqrt(dx * dx + dy * dy);
                            if (d < LINK) {
                                var a = (1 - d / LINK) * .35;
                                ctx.strokeStyle = 'rgba(120,160,220,' + a.toFixed(3) + ')';
                                ctx.lineWidth = 1;
                                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
                            }
                        }
                        ctx.fillStyle = 'rgba(90,140,220,.8)';
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
                    }
                    requestAnimationFrame(step);
                }
                resize(); init(); step();
                window.addEventListener('resize', function () { resize(); init(); });
            })();
        </script>
    </body>
</html>
